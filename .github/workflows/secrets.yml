# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Monthly: are the tap's two secrets still good for a while?
#
#   WINGET_TOKEN     its expiry date, from the header GitHub returns for it;
#                    due 30 days before it expires
#   TAP_SIGNING_KEY  its public half must still be a signing key of the
#                    account (or sync's commits stop being Verified); due
#                    for rotation after 335 days (yearly)
#
# One issue while something is due, closed once it is fixed. The procedure:
# docs/how-to/rotate-secrets.md.
name: secrets

on:
  schedule:
    - cron: "13 6 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  winget-token:
    name: WINGET_TOKEN expiry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: winget
    permissions: {}
    outputs:
      problem: ${{ steps.check.outputs.problem }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: check
        env:
          TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "problem=WINGET_TOKEN is not set: WinGet submissions are skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          headers="$(curl -fsS -o /dev/null -D - -H "Authorization: Bearer $TOKEN" https://api.github.com/user || true)"
          if [ -z "$headers" ]; then
            echo "problem=WINGET_TOKEN is rejected by GitHub (expired or revoked)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          expiry="$(printf '%s' "$headers" | tr -d '\r' | sed -n 's/^github-authentication-token-expiration: //Ip')"
          if [ -z "$expiry" ]; then
            echo "WINGET_TOKEN has no expiry date"
            exit 0
          fi
          days=$(( ( $(date -d "$expiry" +%s) - $(date +%s) ) / 86400 ))
          echo "WINGET_TOKEN expires on $expiry ($days days)"
          if [ "$days" -lt 30 ]; then
            echo "problem=WINGET_TOKEN expires on $expiry, in $days days" >> "$GITHUB_OUTPUT"
          fi

  signing-key:
    name: TAP_SIGNING_KEY age
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    outputs:
      problem: ${{ steps.check.outputs.problem }}
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: check
        env:
          # Read-only: a public endpoint, but anonymous calls from shared
          # runners are rate-limited (403).
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          TITLE: homebrew-tap CI signing
        run: |
          set -euo pipefail
          # An account's SSH signing keys, with their titles.
          created="$(gh api "users/$OWNER/ssh_signing_keys" \
            --jq "[.[] | select(.title == \"$TITLE\")] | first | .created_at // empty")"
          if [ -z "$created" ]; then
            echo "problem=no signing key titled \"$TITLE\" on $OWNER: sync's commits are not Verified" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          days=$(( ( $(date +%s) - $(date -d "$created" +%s) ) / 86400 ))
          echo "the CI signing key is $days days old"
          if [ "$days" -gt 335 ]; then
            echo "problem=the CI signing key is $days days old: rotate it" >> "$GITHUB_OUTPUT"
          fi

  report:
    name: report
    needs: [winget-token, signing-key]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: harden runner (egress audit)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          WINGET: ${{ needs.winget-token.outputs.problem }}
          SIGNING: ${{ needs.signing-key.outputs.problem }}
          FAILED: ${{ contains(needs.*.result, 'failure') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          body=""
          [ -n "$WINGET" ] && body="$body- $WINGET"$'\n'
          [ -n "$SIGNING" ] && body="$body- $SIGNING"$'\n'
          [ "$FAILED" = true ] && body="$body- a check failed to run"$'\n'
          title="Secret rotation due"
          number="$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$body" ]; then
            text="$body"$'\n'"Procedure: docs/how-to/rotate-secrets.md. $RUN_URL"
            if [ -n "$number" ]; then gh issue comment "$number" --body "$text"; else gh issue create --title "$title" --body "$text"; fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Both secrets are fine: $RUN_URL"
          fi
