# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Publishes new tool versions with nobody in the loop:
#
#   detect   bin/tap discover --add: repositories with the gregoiref-tap topic
#            join tools.yml when their entry can be inferred from a release;
#            bin/tap sync: latest stable release of every tool, archives
#            downloaded and hashed, checked against the release's checksums
#            and (verify: attestation) its SLSA provenance; formulae, Scoop
#            and WinGet manifests, README and lock rewritten.
#   test     install-test.yml on those files: real installs on macOS, Linux
#            and Windows, plus brew audit.
#   publish  one commit authored as the owner, signed with the CI signing key
#            (environment `publish`), pushed straight to main. No pull request.
#   site     the catalog on GitHub Pages (pages.yml).
#   winget   komac submits the new WinGet manifests to microsoft/winget-pkgs
#            (environment `winget`; skipped until its token exists).
#
# Polling, not repository_dispatch: the producers then need no token that
# can write here. A release shows up within 30 minutes.
name: sync

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

# One sync at a time; a run that finds main moved fails its push and the
# next run starts from the new main.
concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  detect:
    name: detect and verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
      tools: ${{ steps.sync.outputs.tools }}
      message: ${{ steps.sync.outputs.message }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: discover new tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/tap discover --add
      - id: sync
        env:
          # API rate limit and gh attestation verify; read-only.
          GH_TOKEN: ${{ github.token }}
        run: bin/tap sync
      - if: steps.sync.outputs.changed == 'true'
        run: rake
      - if: steps.sync.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tap-sync
          path: |
            Formula/
            bucket/
            winget/
            README.md
            tools.yml
            tools.lock.json
          retention-days: 7
          if-no-files-found: error

  test:
    name: install test
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    uses: ./.github/workflows/install-test.yml
    with:
      artifact: tap-sync
    # Everything a job of install-test.yml asks for, even the ones skipped on a
    # candidate (health, report): GitHub refuses to start the run otherwise.
    permissions:
      contents: read
      issues: write
      attestations: read

  publish:
    name: signed commit to main
    needs: [detect, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Holds TAP_SIGNING_KEY; deployment branch policy: protected branches.
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tap-sync
      - name: commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MESSAGE: ${{ needs.detect.outputs.message }}
          SIGNING_KEY: ${{ secrets.TAP_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error::TAP_SIGNING_KEY is not set in the publish environment (docs/adr/0003)"
            exit 1
          fi
          key="$RUNNER_TEMP/signing_key"
          (umask 077 && printf '%s\n' "$SIGNING_KEY" > "$key")
          trap 'rm -f "$key"' EXIT

          # The owner's identity: the public key of TAP_SIGNING_KEY is a
          # signing key of the GregoireF account, so GitHub shows the commit
          # as Verified. No co-author, no bot.
          git config user.name "Grégoire FAVREAU"
          git config user.email "16638358+GregoireF@users.noreply.github.com"
          git config gpg.format ssh
          git config user.signingkey "$key"
          git config commit.gpgsign true

          # -A: render also deletes files (an old WinGet version).
          git add -A Formula bucket winget README.md tools.yml tools.lock.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          printf '%s\n' "$MESSAGE" | git commit --file -
          git log -1 --format='%h %s'
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" HEAD:main

  site:
    name: catalog site
    needs: publish
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  winget:
    name: submit to winget-pkgs
    needs: [detect, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds WINGET_TOKEN: a personal access token (public_repo) of the owner,
    # which komac uses to fork microsoft/winget-pkgs and open the pull request.
    environment: winget
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main # the commit publish just pushed
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: submit the new manifests
        env:
          TOOLS: ${{ needs.detect.outputs.tools }}
          GITHUB_TOKEN: ${{ secrets.WINGET_TOKEN }}
          KOMAC_VERSION: "2.17.2" # pin: komac
          KOMAC_SHA256: b03b020eec98acfb0b53e284a6e21815b884be33de6785b97e7a120f0e748966
        run: |
          set -euo pipefail
          if [ -z "$GITHUB_TOKEN" ]; then
            echo "::notice::WINGET_TOKEN is not set in the winget environment: nothing submitted"
            exit 0
          fi
          archive="komac-${KOMAC_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/russellbanks/Komac/releases/download/v${KOMAC_VERSION}/${archive}"
          echo "${KOMAC_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          komac="$(find "$RUNNER_TEMP" -name komac -type f -perm -u+x | head -1)"

          # The manifest folder of each updated tool that has a winget id.
          ruby -Ilib -rtap -e '
            tools = Tap::Config.load("tools.yml").to_h { |t| [t.name, t] }
            lock = Tap::Lock.load("tools.lock.json")
            ENV.fetch("TOOLS").split.each do |name|
              tool = tools[name]
              puts Tap::Winget.directory(tool, lock[name]) if tool&.winget
            end' > "$RUNNER_TEMP/winget-dirs"
          while read -r dir; do
            echo "::group::$dir"
            "$komac" submit --yes "$dir"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/winget-dirs"
