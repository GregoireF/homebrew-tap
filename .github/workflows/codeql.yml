#
# CodeQL on the generator (Ruby) and the workflows (Actions): weekly, on
# pushes to main and on pull requests. Findings go to code scanning.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 5 * * 3"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: [ruby, actions]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
