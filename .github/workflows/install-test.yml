# SPDX-License-Identifier: MIT OR Apache-2.0
#
# Installs every tool the way users do, then runs it:
#   Homebrew on macOS arm64, macOS x86_64, Linux x86_64 and Linux arm64;
#   Scoop on Windows x64 and Windows arm64.
# Nightly on main (catches a release asset that disappeared, or a runner
# image that broke an install), and called by sync.yml on the files it is
# about to publish (input `artifact`), before they reach main.
name: install-test

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      artifact:
        description: Artifact with generated files to test instead of main's.
        type: string
        default: ""

permissions: {}

jobs:
  homebrew:
    name: brew ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS 26 and 15 on Apple silicon, the last Intel image, Linux on
        # both architectures. Not Homebrew's ghcr.io/homebrew/brew image: it
        # runs as a non-root user that cannot write the runner's files, so
        # actions/checkout and the candidate artifact fail there (EACCES).
        os: [macos-26, macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      # Links this checkout, artifact included, as the gregoiref/tap tap.
      - uses: Homebrew/actions/setup-homebrew@63a2d4d8d4193eab3e62b1b782ff3ab8408f5b29 # 2026.11.09.1
      # Homebrew 7 loads formulae of a non-official tap only once trusted
      # (docs.brew.sh/Tap-Trust); the tap here is this checkout.
      - run: brew trust --tap gregoiref/tap
      - name: install and test every formula
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          for formula in Formula/*.rb; do
            name="$(basename "$formula" .rb)"
            echo "::group::$name"
            brew install --formula "gregoiref/tap/$name"
            brew test "gregoiref/tap/$name"
            brew uninstall --formula "gregoiref/tap/$name"
            echo "::endgroup::"
          done
      - if: inputs.artifact != '' && matrix.os == 'ubuntu-24.04'
        run: brew test-bot --only-tap-syntax

  # The site's install.sh, generated from the same lock, run for real:
  # installs, a tampered checksum, a refused --require-provenance.
  installer:
    name: install.sh ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - run: bin/tap site _site
      - run: bash test/installer.sh _site/install.sh
      # musl: static builds must install, glibc-only ones be refused cleanly.
      - if: runner.os == 'Linux'
        run: >-
          docker run --rm -v "$PWD:/w:ro" -w /w alpine:3.22
          sh -c 'apk add -q bash curl xz && bash test/installer.sh _site/install.sh'

  # flake.nix: every package built and run, on Linux and macOS.
  nix:
    name: nix ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: build and run every package
        run: |
          set -euo pipefail
          nix flake check --all-systems --no-build "path:$PWD"
          for tool in $(nix eval --raw "path:$PWD#packages.x86_64-linux" --apply 'p: builtins.concatStringsSep " " (builtins.attrNames p)'); do
            echo "::group::$tool"
            nix run "path:$PWD#$tool" -- --version || nix run "path:$PWD#$tool" -- version
            echo "::endgroup::"
          done

  # aqua/registry.yaml with aqua itself (pinned, checked against its
  # checksums), at the versions the lock serves.
  aqua:
    name: aqua ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux_amd64
          - os: macos-26
            platform: darwin_arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: install aqua
        env:
          AQUA_VERSION: "2.66.1" # pin: aqua
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          base="https://github.com/aquaproj/aqua/releases/download/v${AQUA_VERSION}"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/aqua_${PLATFORM}.tar.gz"
          curl -fsSLO "$base/aqua_${AQUA_VERSION}_checksums.txt"
          grep " aqua_${PLATFORM}.tar.gz\$" "aqua_${AQUA_VERSION}_checksums.txt" | shasum -a 256 -c -
          mkdir -p bin && tar -xzf "aqua_${PLATFORM}.tar.gz" -C bin aqua
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: bash test/aqua.sh

  scoop:
    name: scoop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: inputs.artifact != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
      # Reads tools.yml (binaries and test arguments of each tool).
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: install Scoop
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile install-scoop.ps1
          ./install-scoop.ps1 -RunAsAdmin
          Remove-Item install-scoop.ps1
          Join-Path (Resolve-Path ~).Path "scoop\shims" >> $env:GITHUB_PATH
      - name: install and run every manifest
        run: |
          $ErrorActionPreference = 'Stop'
          $tools = Get-Content tools.yml -Raw | ruby -ryaml -rjson -e 'puts JSON.generate(YAML.safe_load($stdin.read)["tools"])' | ConvertFrom-Json
          foreach ($manifest in Get-ChildItem bucket/*.json) {
            $name = $manifest.BaseName
            $version = (Get-Content $manifest -Raw | ConvertFrom-Json).version
            $tool = $tools.$name
            Write-Output "::group::$name $version"
            scoop install $manifest.FullName
            if ($LASTEXITCODE -ne 0) { throw "scoop install $name failed" }
            $out = & $tool.binaries[0] @($tool.test) 2>&1 | Out-String
            Write-Output $out
            if ($out -notmatch [regex]::Escape($version)) { throw "$name does not print $version" }
            scoop uninstall $name
            Write-Output "::endgroup::"
          }
      # The WinGet manifests the tap will submit, checked by winget itself
      # where the runner image has it.
      - name: validate the WinGet manifests
        run: |
          if (-not (Get-Command winget -ErrorAction SilentlyContinue)) {
            Write-Output "::notice::winget is not installed on this runner image"
            exit 0
          }
          foreach ($dir in Get-ChildItem -Directory winget/manifests/*/*/*/*) {
            winget validate --manifest $dir.FullName
            if ($LASTEXITCODE -ne 0) { throw "winget validate $($dir.FullName) failed" }
          }

  # Nightly: what installing does not show (stale tools, provenance GitHub
  # no longer holds, a checksum-only tool that could be verified now).
  health:
    name: health
    if: inputs.artifact == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      attestations: read # look attestations up by digest
    outputs:
      report: ${{ steps.health.outputs.report }}
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - id: health
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/tap health

  # Nightly only: one issue per problem kind, opened while it lasts and
  # closed once it is gone. Nothing to read when everything works.
  report:
    name: report
    # Not when sync calls this workflow on a candidate (its event is also
    # `schedule`): only main's own nightly run reports.
    if: always() && github.event_name == 'schedule' && inputs.artifact == ''
    needs: [homebrew, installer, nix, aqua, scoop, health]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INSTALL_FAILED: >-
            ${{ needs.homebrew.result == 'failure' || needs.installer.result == 'failure' ||
            needs.nix.result == 'failure' || needs.aqua.result == 'failure' || needs.scoop.result == 'failure' }}
          HEALTH_FAILED: ${{ needs.health.result == 'failure' }}
          HEALTH_REPORT: ${{ needs.health.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # track TITLE FAILED BODY: open, comment on, or close the issue TITLE.
          track() {
            number="$(gh issue list --state open --search "in:title \"$1\"" --json number --jq '.[0].number // empty')"
            if [ "$2" = "true" ]; then
              if [ -n "$number" ]; then
                gh issue comment "$number" --body "Still the case: $RUN_URL"$'\n\n'"$3"
              else
                gh issue create --title "$1" --body "$3"$'\n\n'"$RUN_URL"
              fi
            elif [ -n "$number" ]; then
              gh issue close "$number" --comment "Fixed: $RUN_URL"
            fi
          }
          track "Nightly install test failing" "$INSTALL_FAILED" "An install of a published version failed."
          track "Tap health report" "$HEALTH_FAILED" "${HEALTH_REPORT:-See the health job.}"
