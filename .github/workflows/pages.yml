# SPDX-License-Identifier: MIT OR Apache-2.0
#
# The catalog site, https://gregoiref.github.io/homebrew-tap/, built by
# `bin/tap site` from tools.yml and the lock. Called by sync.yml after each
# publication (a push by the job token triggers no workflow), and on pushes
# by the owner that change what the site shows.
name: pages

on:
  push:
    branches: [main]
    paths:
      - tools.yml
      - tools.lock.json
      - templates/site/**
      - schema/api.schema.json
      - lib/tap/targets/**
  # After the nightly install test (04:17), so the install-tests badges
  # show its result.
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the last install-test run's conclusion, for the badges
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: main
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: "3.4"
      - name: build the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion="$(gh run list --workflow install-test.yml --branch main --status completed --limit 1 \
            --json conclusion --jq '.[0].conclusion // empty')"
          case "$conclusion" in
            success) bin/tap site _site --install-tests passing ;;
            failure) bin/tap site _site --install-tests failing ;;
            *) bin/tap site _site ;;
          esac
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write # publish the site
      id-token: write # prove the deployment comes from this workflow
    steps:
      - name: harden runner (egress audit)
        if: runner.os == 'Linux'
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
