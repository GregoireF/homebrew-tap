#
# One grouped pull request a month for the pinned actions, merged on its own
# by ci.yml's automerge job once CI passes. Nothing else here has dependencies: the
# generator uses Ruby's standard library only.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A release must be a week old before it is proposed: time for a
    # compromised version to be noticed and pulled.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "⬆️ build"
      include: scope
    labels: []
